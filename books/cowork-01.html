<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>클로드 코워크로 업무 자동화 — 엑셀·PPT·문서, 말로 시키고 결과만 받기</title>
<meta name="description" content="엑셀·PPT·문서, 말로 시키고 결과만 받기">
<meta property="og:type" content="book">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&display=swap');

/* ── 색·글꼴 토큰 ─────────────────────────────────────── */
:root{
 --bg:#eceae5;      /* 화면 배경(책상) */
 --paper:#fdfcfa;   /* 종이 */
 --wash:#f5f2ec;    /* 챕터 표지용 종이 */
 --ink:#15130f; --ink2:#33302a; --muted:#6b6560; --dim:#a39c93;
 --line:#e6e1d9; --line2:#d6d0c6;
 --accent:#c8811f;  /* 강조색. 채널 색으로 바꾸세요 */
 --code:#16161f; --codeink:#e9e9f2;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
 font-family:'Noto Serif KR',Georgia,serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.eyebrow,.chnum,.foot,.note,.src,.tocrow,table,pre,code,#bar,.kick{font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo',sans-serif}

/* ── 진행 바 ─────────────────────────────────────────── */
#prog{position:fixed;top:0;left:0;height:2px;background:var(--ink);z-index:70;width:0;transition:width .2s}

/* ── 덱(페이지 묶음) ─────────────────────────────────── */
#deck{position:relative;width:100vw;height:100vh}
.s{position:absolute;inset:0;display:none;justify-content:center;align-items:center;padding:20px 16px 70px}
.s.on{display:flex;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── 종이 한 장 (A4 비율 1:1.414) ───────────────────── */
.paper{position:relative;background:var(--paper);
 width:min(calc((100vh - 90px) * 0.707), 94vw);
 height:min(calc(100vh - 90px), 1000px);
 box-shadow:0 8px 34px rgba(0,0,0,.13);border:1px solid var(--line2);
 display:flex;flex-direction:column;overflow:hidden}
.s.alt .paper{background:var(--wash)}
.pin{flex:1;overflow-y:auto;padding:clamp(28px,4.4vh,52px) clamp(24px,4vh,48px) 12px;
 display:flex;flex-direction:column;justify-content:center}
.s.cover .pin,.s.open .pin{text-align:center;align-items:center}
.foot{flex:none;display:flex;justify-content:space-between;padding:10px clamp(24px,4vh,48px) 14px;
 font-size:10.5px;color:var(--dim);letter-spacing:.4px;border-top:1px solid var(--line)}

/* ── 글자 ────────────────────────────────────────────── */
.eyebrow{display:block;font-size:10.5px;font-weight:800;letter-spacing:1.8px;color:var(--dim);text-transform:uppercase;margin-bottom:12px}
h1{font-size:clamp(26px,4.6vh,40px);font-weight:900;letter-spacing:-1.8px;line-height:1.1;margin:0}
h2{font-size:clamp(21px,3.5vh,31px);font-weight:900;letter-spacing:-1.2px;line-height:1.2;margin:0}
h3{font-size:clamp(18px,2.9vh,25px);font-weight:900;letter-spacing:-.8px;line-height:1.25;margin:0 0 16px}
.chnum{font-size:clamp(44px,9vh,84px);font-weight:900;letter-spacing:-4px;line-height:1;color:var(--line2);margin:0 0 6px}
.kick{font-size:clamp(13px,1.9vh,15.5px);color:var(--muted);margin:14px 0 0;line-height:1.7}
.by{margin-top:26px;font-size:12.5px;color:var(--muted);letter-spacing:.3px}
.prose p{font-size:clamp(13.5px,1.94vh,16px);line-height:1.95;margin:0 0 15px;color:var(--ink2);word-break:keep-all}
.prose p b{color:var(--ink);font-weight:700}
.prose p:last-child{margin-bottom:0}
ul.prose,ol.prose{margin:0 0 15px;padding-left:22px}
.prose li{font-size:clamp(13.5px,1.94vh,16px);line-height:1.85;color:var(--ink2);margin:0 0 4px;word-break:keep-all}
.prose a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent)}
blockquote{margin:16px 0;padding:14px 18px;border-left:3px solid var(--accent);background:#fff;
 font-size:clamp(14px,2.1vh,17px);line-height:1.8;color:var(--ink);font-weight:500}
.note{margin:14px 0 0;padding:12px 14px;background:#fff;border:1px solid var(--line);font-size:12.5px;line-height:1.7;color:var(--muted)}
.note b{color:var(--ink)}
.src{margin-top:auto;padding-top:12px;font-size:11px;color:var(--dim);line-height:1.6}
pre{background:var(--code);color:var(--codeink);padding:12px 14px;overflow-x:auto;font-size:11.5px;line-height:1.6;margin:14px 0;border-radius:2px}
code{font-family:ui-monospace,Menlo,Consolas,monospace}
p code{background:#fff;border:1px solid var(--line);padding:1px 5px;font-size:.92em}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin:14px 0}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;line-height:1.55}
td:first-child,th:first-child{white-space:nowrap}
th{font-weight:800;color:var(--muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase}
.tocrow{display:flex;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tocrow:hover .tt{color:var(--accent)}
.tocrow .tn{flex:none;width:34px;font-size:12px;font-weight:800;color:var(--dim)}
.tocrow .tt{flex:1;font-size:clamp(14px,2.1vh,17px);font-weight:700;letter-spacing:-.3px}
.tocrow .tp{flex:none;font-size:11.5px;color:var(--dim)}
figure{margin:14px 0}
figure img{width:100%;display:block;border:1px solid var(--line)}
figcaption{font-size:11px;color:var(--dim);margin-top:6px;text-align:center}

/* ── 유튜브 (누르면 그때 불러옴) ─────────────────────── */
.vwrap{position:relative;aspect-ratio:16/9;background:#000;margin:14px 0;overflow:hidden}
.vwrap iframe,.vframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vframe{background:#111 center/cover no-repeat;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Pretendard',sans-serif;font-weight:800;letter-spacing:.3px}
.vframe::after{content:'▶  영상 보기';background:rgba(0,0,0,.55);padding:10px 18px;border-radius:999px}

/* ── 세미나·강연 정리용 ──────────────────────────────── */
/* 발표자 정보칸 */
.who{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin:0 0 14px;padding:0 0 12px;border-bottom:1px solid var(--line)}
.who .nm{font-size:clamp(14px,2.1vh,16.5px);font-weight:800;letter-spacing:-.3px;color:var(--ink)}
.who .af{font-size:12.5px;color:var(--muted)}
.who .tm{font-size:11.5px;color:var(--dim);margin-left:auto;font-variant-numeric:tabular-nums}
/* 핵심 한 줄 */
.key{display:flex;gap:10px;align-items:flex-start;margin:14px 0;padding:13px 15px;background:#fff;border:1px solid var(--accent);border-left-width:3px}
.key::before{content:'핵심';flex:none;font-size:10px;font-weight:900;letter-spacing:1px;color:var(--accent);padding-top:3px}
.key span{font-size:clamp(13.5px,2vh,16px);line-height:1.75;font-weight:600;color:var(--ink);word-break:keep-all}
/* 질의응답 */
.qa{margin:14px 0;border:1px solid var(--line);background:#fff}
.qa+.qa{margin-top:10px}
.qa .q,.qa .a{display:flex;gap:11px;padding:12px 14px;font-size:clamp(13px,1.9vh,15.5px);line-height:1.8;word-break:keep-all}
.qa .q{border-bottom:1px solid var(--line);font-weight:600;color:var(--ink)}
.qa .a{color:var(--ink2);background:var(--wash)}
.qa .mk{flex:none;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 font:800 10.5px 'Pretendard',sans-serif;margin-top:3px}
.qa .q .mk{background:var(--ink);color:#fff}
.qa .a .mk{background:var(--accent);color:#fff}
.qa .by{display:block;font-size:11px;color:var(--dim);font-weight:500;margin-top:3px}
/* 시간 링크 */
.tj{display:inline-flex;align-items:center;gap:4px;font:700 11.5px ui-monospace,Menlo,Consolas,monospace;
 color:var(--accent);background:#fff;border:1px solid var(--line2);border-radius:3px;padding:2px 7px;
 cursor:pointer;vertical-align:baseline;font-variant-numeric:tabular-nums;text-decoration:none}
.tj:hover{background:var(--wash);border-color:var(--accent)}
.tj::before{content:'▶';font-size:8px}
/* 시간 목차 */
.marks{margin:14px 0;border-top:1px solid var(--line)}
.marks .mrow{display:flex;gap:12px;align-items:baseline;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.marks .mrow:hover{background:var(--wash)}
.marks .mrow:hover .mt{color:var(--accent)}
.marks .ms{flex:none;font:700 11.5px ui-monospace,Menlo,Consolas,monospace;color:var(--accent);font-variant-numeric:tabular-nums;min-width:46px}
.marks .mt{flex:1;font-size:clamp(12.5px,1.85vh,14.5px);line-height:1.65;color:var(--ink2);word-break:keep-all}

/* ── 하단 바 ─────────────────────────────────────────── */
#bar{position:fixed;left:0;right:0;bottom:0;height:52px;display:flex;justify-content:center;align-items:center;gap:8px;
 background:linear-gradient(to top,var(--bg) 60%,transparent);z-index:60}
#bar button{width:40px;height:34px;border:1px solid var(--line2);background:var(--paper);font-size:20px;line-height:1;cursor:pointer;color:var(--ink);border-radius:2px}
#bar button:hover{background:#fff}
#jump{height:34px;max-width:52vw;border:1px solid var(--line2);background:var(--paper);color:var(--ink);font-size:12.5px;padding:0 8px;border-radius:2px}
/* ── 오른쪽 위 메뉴 (PDF·링크) ─────────────────────── */
#menu{position:fixed;top:12px;right:14px;z-index:60;font-family:'Pretendard',sans-serif}
#mbtn{font:800 11px 'Pretendard',sans-serif;letter-spacing:.8px;color:var(--muted);cursor:pointer;
 border:1px solid var(--line2);padding:6px 10px;background:var(--paper);border-radius:2px}
#mbtn:hover{color:var(--ink)}
#mlist{display:none;position:absolute;right:0;top:34px;min-width:190px;background:var(--paper);border:1px solid var(--line2);
 box-shadow:0 6px 24px rgba(0,0,0,.12);border-radius:2px;padding:6px 0}
#menu.on #mlist{display:block}
#mlist a,#mlist button{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
 padding:9px 14px;font:500 13px 'Pretendard',sans-serif;color:var(--ink);text-decoration:none}
#mlist a:hover,#mlist button:hover{background:var(--wash)}
#mlist small{display:block;font-size:10.5px;color:var(--dim);margin-top:2px}
/* ── 잠금 화면 (잠긴 책에서만 보임) ─────────────────── */
#gate{display:none;position:fixed;inset:0;z-index:90;background:var(--bg);align-items:center;justify-content:center;padding:16px}
#gate.on{display:flex}
.gbox{background:var(--paper);border:1px solid var(--line2);box-shadow:0 8px 34px rgba(0,0,0,.13);padding:36px 30px 30px;width:min(360px,100%);text-align:center;font-family:'Pretendard',sans-serif}
.gbox .gi{font-size:28px;margin-bottom:10px}
.gbox h3{margin:0 0 8px}
.gbox p{margin:0 0 18px;font-size:13.5px;line-height:1.7;color:var(--muted)}
.gcode{width:100%;height:42px;border:1px solid var(--line2);background:#fff;font:500 15px 'Pretendard',sans-serif;text-align:center;letter-spacing:2px;padding:0 10px;margin-bottom:10px;border-radius:2px}
.gcode:focus{outline:none;border-color:var(--ink)}
.ga{width:100%;height:42px;border:0;background:var(--ink);color:#fff;font:700 14px 'Pretendard',sans-serif;cursor:pointer;border-radius:2px}
.ga:hover{background:#000}
.gerr{min-height:18px;margin:10px 0 0;font-size:12px;color:#b3261e}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--ink);color:#fff;
 font:500 12.5px 'Pretendard',sans-serif;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:80}
#toast.on{opacity:1}

/* ── 인쇄(PDF 저장) ──────────────────────────────────── */
@page{size:A4;margin:0}
@media print{
 html,body{height:auto;overflow:visible;background:#fff}
 #prog,#bar,#menu,#toast{display:none!important}
 #deck{width:210mm;height:auto}
 .s{position:static;display:flex!important;width:210mm;height:297mm;padding:0;animation:none;
    break-after:page;page-break-after:always;overflow:hidden}
 .s:last-child{break-after:auto;page-break-after:auto}
 .s .paper{width:100%;height:100%;max-height:none;box-shadow:none;border:0}
 .pin{overflow:hidden;padding:18mm 16mm 6mm}
 .foot{padding:4mm 16mm 8mm}
 .prose p{font-size:11.5pt;line-height:1.9}
 h1{font-size:30pt}h2{font-size:22pt}h3{font-size:17pt}.chnum{font-size:60pt}
 .vwrap{display:none}
 .tj{color:var(--muted);border-color:var(--line)}
 .tj::before{content:''}
 .marks .mrow{cursor:default}
 a{color:inherit;text-decoration:none}
}
</style>
</head>
<body>
<div id="prog"></div>
<div id="menu">
 <button id="mbtn" type="button" aria-haspopup="true" aria-expanded="false">PDF ▾</button>
 <div id="mlist" role="menu">
  <a id="mpdf" href="#" download>PDF 내려받기<small>같은 이름의 .pdf 파일</small></a>
  <button id="mprint" type="button">인쇄로 PDF 저장<small>Mac ⌘P · Windows Ctrl+P</small></button>
  <button id="mlink" type="button">이 쪽 링크 복사<small>지금 보는 쪽 주소</small></button>
 </div>
</div>
<div id="toast"></div>
<div id="gate"><div class="gbox">
 <div class="gi">🔒</div>
 <h3 id="gt">코드가 필요합니다</h3>
 <p id="gp">안내받은 코드를 넣어 주세요.</p>
 <input id="gc" class="gcode" type="text" autocomplete="off" placeholder="코드">
 <button id="gb" class="ga" type="button">열기</button>
 <p class="gerr" id="ge"></p>
</div></div>

<script>
(function(){
 var deck=document.getElementById('deck'), prog=document.getElementById('prog'), jump=document.getElementById('jump');
 var menu=document.getElementById('menu'), mbtn=document.getElementById('mbtn'), toast=document.getElementById('toast');
 var gate=document.getElementById('gate'), cipher=document.getElementById('cipher');
 // 발행된 책은 읽기 페이지(/ebook/b/)가 EBOOK_BASE 를 넣어 준다. 그 값으로 PDF 위치와 저장 키를 정한다.
 var BASE=(window.EBOOK_BASE)||location.pathname.replace(/\.html?$/,'');
 var KEY=BASE+'_page', KEYC=BASE+'_code';
 var S=[], N=0, i=0, code='';

 function say(t){toast.textContent=t;toast.classList.add('on');clearTimeout(say.t);say.t=setTimeout(function(){toast.classList.remove('on');},1800);}

 // ── 암호 풀기 (잠긴 책) ─────────────────────────────
 // 형식: {"salt","iv","ct"} base64. PBKDF2-SHA256 → AES-GCM-256. scripts/lock_ebook.mjs 와 같은 규칙.
 function b2a(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0);});}
 async function keyFrom(pw,salt){
  var raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFC')),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);
 }
 async function decrypt(pw,box){
  var k=await keyFrom(pw,b2a(box.salt));
  return crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(box.iv)},k,b2a(box.ct));
 }
 async function tryOpen(pw,quiet){
  pw=(pw||'').trim(); if(!pw) return false;
  var box; try{box=JSON.parse(cipher.textContent);}catch(e){return false;}
  try{
   var buf=await decrypt(pw,box);
   deck.innerHTML=new TextDecoder().decode(buf);
   code=pw; try{localStorage.setItem(KEYC,pw);}catch(e){}
   gate.classList.remove('on'); start(); return true;
  }catch(e){
   if(!quiet) document.getElementById('ge').textContent='코드가 맞지 않아요. 다시 확인해 주세요.';
   try{localStorage.removeItem(KEYC);}catch(e2){}
   return false;
  }
 }

 // ── 책 넘기기 ───────────────────────────────────────
 function start(){
  S=[].slice.call(document.querySelectorAll('#deck > .s')); N=S.length; if(!N) return;
  jump.innerHTML='';
  S.forEach(function(s,n){
   var t=s.querySelector('h1,h2,h3'); var o=document.createElement('option');
   var label=t?t.innerHTML.replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim():'쪽';
   o.value=n; o.textContent=(n+1)+'. '+label; jump.appendChild(o);
  });
  document.querySelectorAll('.tocrow').forEach(function(r){
   r.onclick=function(){
    var t=S.findIndex(function(s){var c=s.querySelector('.chnum');return c&&c.textContent.trim()===r.dataset.go;});
    if(t>=0) go(t);
   };
  });
  document.querySelectorAll('.vframe').forEach(function(b){
   b.onclick=function(){ playVideo(b.closest('.vwrap')); };
  });
  // 시간을 누르면 그 쪽의 영상이 해당 지점부터 재생된다
  document.querySelectorAll('.tj').forEach(function(el){
   el.onclick=function(e){ e.preventDefault(); jumpTo(el); };
  });
  document.querySelectorAll('.marks .mrow').forEach(function(el){
   el.onclick=function(){ jumpTo(el); };
  });
  var m=location.hash.match(/^#p(\d+)$/), saved=null;
  try{saved=localStorage.getItem(KEY);}catch(e){}
  i=0; S.forEach(function(s){s.classList.remove('on');});
  go(m?(+m[1]-1):(saved!==null?+saved:0));
 }
 // 영상 틀기. sec 를 주면 그 시점부터.
 function playVideo(wrap, sec){
  if(!wrap) return;
  var f=document.createElement('iframe');
  f.src='https://www.youtube-nocookie.com/embed/'+wrap.dataset.v+'?autoplay=1&rel=0'+(sec?'&start='+sec:'');
  f.setAttribute('allow','autoplay; encrypted-media; picture-in-picture; web-share');
  f.allowFullscreen=true; f.title='강의 영상';
  var old=wrap.querySelector('iframe, .vframe');
  if(old) old.replaceWith(f); else wrap.appendChild(f);
 }
 // 같은 쪽의 영상을 찾고, 없으면 앞쪽에서 가장 가까운 영상 쪽으로 이동한다
 function jumpTo(el){
  var sec=+el.dataset.t||0, page=el.closest('.s');
  var wrap=page&&page.querySelector('.vwrap');
  if(!wrap){
   var i0=S.indexOf(page);
   for(var k=i0;k>=0&&!wrap;k--) wrap=S[k].querySelector('.vwrap');
   if(wrap){ var t=S.indexOf(wrap.closest('.s')); if(t>=0) go(t); }
  }
  if(wrap) playVideo(wrap, sec);
 }
 function go(n){
  if(!N) return;
  n=Math.max(0,Math.min(N-1,n));
  S[i].classList.remove('on'); i=n; S[i].classList.add('on');
  var pin=S[i].querySelector('.pin'); if(pin) pin.scrollTop=0;
  prog.style.width=((i+1)/N*100)+'%'; jump.value=i;
  try{history.replaceState(null,'','#p'+(i+1));}catch(e){}
  try{localStorage.setItem(KEY,i);}catch(e){}
 }
 document.getElementById('prev').onclick=function(){go(i-1)};
 document.getElementById('next').onclick=function(){go(i+1)};
 jump.onchange=function(){go(+jump.value)};
 addEventListener('keydown',function(e){
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(i+1);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1);}
  if(e.key==='Home')go(0); if(e.key==='End')go(N-1);
 });
 var x0=null;
 addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
 addEventListener('touchend',function(e){
  if(x0===null)return; var dx=e.changedTouches[0].clientX-x0; x0=null;
  if(Math.abs(dx)>55) go(i+(dx<0?1:-1));
 },{passive:true});
 addEventListener('hashchange',function(){var m=location.hash.match(/^#p(\d+)$/); if(m) go(+m[1]-1);});

 // ── 메뉴: PDF 내려받기 / 인쇄 / 링크 복사 ────────────
 function closeMenu(){menu.classList.remove('on');mbtn.setAttribute('aria-expanded','false');}
 mbtn.onclick=function(e){e.stopPropagation();menu.classList.toggle('on');mbtn.setAttribute('aria-expanded',menu.classList.contains('on'));};
 addEventListener('click',function(e){if(!menu.contains(e.target))closeMenu();});
 addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu();});
 var base=BASE, mpdf=document.getElementById('mpdf');
 var pdfName=(document.title.split(' — ')[0]||'ebook')+'.pdf';
 // 잠긴 책은 같은 이름의 .pdf.enc 를 받아 코드로 풀어서 내려준다
 var pdfHref=cipher?base+'.pdf.enc':base+'.pdf';
 mpdf.href=pdfHref; mpdf.download=pdfName;
 function saveBlob(blob){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=pdfName;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);}
 mpdf.onclick=function(e){
  closeMenu(); e.preventDefault();
  if(!cipher && location.protocol==='file:'){ location.href=pdfHref; return; }
  var t=mpdf.firstChild; t.textContent='받는 중…';
  fetch(pdfHref).then(function(r){
   if(!r.ok) throw 0;
   if(!cipher) return r.blob().then(saveBlob);
   return r.json().then(function(box){return decrypt(code,box);}).then(function(buf){saveBlob(new Blob([buf],{type:'application/pdf'}));});
  }).catch(function(){ say('아직 PDF 파일이 없어요. 인쇄로 저장을 눌러 주세요.'); })
  .then(function(){ t.textContent='PDF 내려받기'; });
 };
 document.getElementById('mprint').onclick=function(){closeMenu();window.print();};
 document.getElementById('mlink').onclick=function(){
  closeMenu(); var u=location.origin+location.pathname+location.search+'#p'+(i+1);
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){say('링크를 복사했어요');},function(){prompt('링크',u);});
 };

 // ── 시작 ────────────────────────────────────────────
 if(cipher){
  gate.classList.add('on');
  var inp=document.getElementById('gc'), btn=document.getElementById('gb');
  btn.onclick=function(){tryOpen(inp.value,false);};
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')btn.click();});
  var saved=''; try{saved=localStorage.getItem(KEYC)||'';}catch(e){}
  if(saved) tryOpen(saved,true);          // 한 번 넣었으면 다시 묻지 않는다
  setTimeout(function(){try{inp.focus();}catch(e){}},100);
 } else {
  start();
 }
})();
</script>
