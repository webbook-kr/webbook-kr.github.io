name: 빵캘 일정 모으기

on:
  schedule:
    # 한국 시간 아침 7시와 저녁 7시 (UTC 기준 22시, 10시)
    - cron: '0 22 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bbangcal
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 일정 모으기
        run: node scripts/bbang-calender/collect.mjs
        continue-on-error: true

      - name: 장소를 지도 좌표로 바꾸기
        run: node scripts/bbang-calender/geocode.mjs
        continue-on-error: true

      - name: 구독용 달력 굽기
        run: node scripts/bbang-calender/ics.mjs

      - name: 바뀐 것이 있으면 올리기
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bbang-calender/data/events.json bbang-calender/data/places.json bbang-calender/ics
          if git diff --cached --quiet; then
            echo "바뀐 일정이 없습니다."
          else
            git commit -m "빵캘: 일정 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
